<!DOCTYPE html>
<html lang="ko" data-theme="porcelain">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>2048 Studio — Tactile Puzzle Edition</title>
  <meta name="description" content="세라믹 질감의 모던한 디자인, 4가지 큐레이션 테마, 데일리 챌린지, 되돌리기, 프로시저럴 사운드를 갖춘 프리미엄 2048 퍼즐 게임." />
  <meta name="theme-color" content="#F4F1EA" />

  <!-- Crisp Ceramic Tile Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231E242B'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23F4CB6B' font-family='system-ui,sans-serif' font-weight='800' font-size='21'%3E2048%3C/text%3E%3C/svg%3E" />

  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <main class="app-shell">
    <section class="studio-frame" aria-label="2048 퍼즐 게임">
      <!-- Header: Brand & Score Cards -->
      <header class="top-bar">
        <div class="brand">
          <h1 class="brand-title">2048</h1>
          <p class="brand-subtitle">
            <span>Tactile Studio Edition</span>
            <span id="daily-badge" class="daily-badge" hidden>DAILY</span>
          </p>
        </div>

        <div class="score-cluster" aria-label="점수판">
          <div id="score-card" class="score-card">
            <span class="score-label">점수</span>
            <span id="score-value" class="score-value">0</span>
          </div>
          <div id="best-card" class="score-card">
            <span class="score-label">최고 기록</span>
            <span id="best-value" class="score-value">0</span>
          </div>
        </div>
      </header>

      <!-- Control Strip: Modes + Quick Actions -->
      <nav class="control-strip" aria-label="게임 모드 및 도구">
        <div class="mode-tabs" role="tablist" aria-label="보드 모드 선택">
          <button id="tab-classic" class="mode-tab" role="tab" data-mode="classic" aria-selected="true">4×4</button>
          <button id="tab-fibonacci" class="mode-tab" role="tab" data-mode="fibonacci" aria-selected="false">피보나치</button>
          <button id="tab-daily" class="mode-tab" role="tab" data-mode="daily" aria-selected="false">오늘</button>
          <button id="tab-sprint" class="mode-tab" role="tab" data-mode="sprint" aria-selected="false">3×3</button>
          <button id="tab-marathon" class="mode-tab" role="tab" data-mode="marathon" aria-selected="false">5×5</button>
        </div>

        <div class="action-group">
          <button id="btn-undo" class="icon-btn" title="되돌리기 (Z)" aria-label="이전 수 되돌리기" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7v6h6" />
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
            </svg>
            <span id="undo-count" class="undo-count">5</span>
          </button>

          <button id="btn-sound" class="icon-btn" title="사운드 켜기/끄기 (M)" aria-label="사운드 끄기" aria-pressed="true"></button>

          <button id="btn-stats" class="icon-btn" title="통계 및 타일 도감" aria-label="통계 및 타일 도감 보기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 20V10" />
              <path d="M12 20V4" />
              <path d="M6 20v-6" />
            </svg>
          </button>

          <button id="btn-new-game" class="icon-btn btn-primary" title="새 게임 (R)" aria-label="새 게임 시작">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
            </svg>
          </button>
        </div>
      </nav>

      <!-- Milestone Progress Rail -->
      <div class="status-rail" aria-label="진행 상황">
        <div class="status-meta">
          <div class="status-left">
            <span id="progress-label">최고 타일 2 / 목표 2048</span>
            <span id="combo-pill" class="combo-pill" aria-live="polite">2× COMBO</span>
          </div>
          <span id="moves-timer">0수 · 0:00</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="목표 타일 진행률">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="fib-ribbon" class="fib-ribbon" hidden aria-label="피보나치 수열 가이드">
          <div id="fib-seq-track" class="fib-seq-track"></div>
          <span class="fib-rule-hint">인접 수 병합 (1+1=2)</span>
        </div>
      </div>

      <!-- Tactile Game Board -->
      <div id="board-stage" class="board-stage" role="application" aria-label="2048 게임 보드. 방향키 또는 스와이프로 타일을 이동하세요.">
        <div id="board-inner" class="board-inner">
          <div id="grid-bg" class="grid-bg" aria-hidden="true"></div>
          <div id="tile-layer" class="tile-layer"></div>
        </div>

        <canvas id="fx-canvas" class="fx-canvas" aria-hidden="true"></canvas>

        <!-- Win / Game Over Overlay -->
        <div id="board-overlay" class="board-overlay" aria-hidden="true">
          <span id="overlay-kicker" class="overlay-kicker">MILESTONE FORGED</span>
          <h2 id="overlay-title" class="overlay-title">2048 달성!</h2>

          <div class="overlay-summary">
            <div class="overlay-stat">
              <span class="overlay-stat-label">점수</span>
              <span id="overlay-score" class="overlay-stat-val">0</span>
            </div>
            <div class="overlay-stat">
              <span class="overlay-stat-label">최고 타일</span>
              <span id="overlay-max" class="overlay-stat-val">2048</span>
            </div>
            <div class="overlay-stat">
              <span class="overlay-stat-label">이동</span>
              <span id="overlay-moves" class="overlay-stat-val">0수</span>
            </div>
          </div>

          <div class="overlay-actions">
            <button id="btn-overlay-continue" class="overlay-btn primary">계속 도전하기</button>
            <button id="btn-overlay-share" class="overlay-btn">결과 공유</button>
            <button id="btn-overlay-restart" class="overlay-btn">새 게임</button>
          </div>
        </div>
      </div>

      <!-- Footer: Curated Theme Picker & Shortcuts -->
      <footer class="bottom-bar">
        <div class="theme-picker" role="group" aria-label="테마 선택">
          <button id="theme-porcelain" class="theme-swatch swatch-porcelain" data-theme="porcelain" aria-label="포슬린 라이트 테마" aria-pressed="true" title="Porcelain"></button>
          <button id="theme-obsidian" class="theme-swatch swatch-obsidian" data-theme="obsidian" aria-label="옵시디언 다크 테마" aria-pressed="false" title="Obsidian"></button>
          <button id="theme-matcha" class="theme-swatch swatch-matcha" data-theme="matcha" aria-label="말차 아틀리에 테마" aria-pressed="false" title="Matcha"></button>
          <button id="theme-sandstone" class="theme-swatch swatch-sandstone" data-theme="sandstone" aria-label="샌드스톤 웜 테마" aria-pressed="false" title="Sandstone"></button>
        </div>

        <div class="hint-line" aria-hidden="true">
          <span class="kbd">↑↓←→</span>
          <span>이동</span>
          <span class="kbd">Z</span>
          <span>되돌리기</span>
          <span class="kbd">R</span>
          <span>새 게임</span>
        </div>
      </footer>
    </section>
  </main>

  <!-- Career Stats & Tile Collection Modal -->
  <div id="stats-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="stats-modal-title" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="stats-modal-title" class="modal-title">플레이 통계 &amp; 타일 도감</h2>
        <button id="btn-stats-close" class="modal-close" aria-label="닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <div class="stats-grid">
        <div class="stat-tile">
          <span class="stat-tile-label">플레이 횟수</span>
          <span id="stat-games" class="stat-tile-value">0</span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-label">목표 달성률</span>
          <span id="stat-win-rate" class="stat-tile-value">0%</span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-label">역대 최고 타일</span>
          <span id="stat-highest-tile" class="stat-tile-value">2</span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-label">최대 연속 콤보</span>
          <span id="stat-best-combo" class="stat-tile-value">0×</span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-label">누적 병합 수</span>
          <span id="stat-total-merges" class="stat-tile-value">0</span>
        </div>
        <div class="stat-tile">
          <span class="stat-tile-label">오늘의 도전 클리어</span>
          <span id="stat-daily-count" class="stat-tile-value">0일</span>
        </div>
      </div>

      <div class="gallery-header">
        <h3 class="section-heading">해금한 세라믹 타일</h3>
        <div class="gallery-tabs" role="tablist" aria-label="도감 종류 선택">
          <button id="gallery-tab-power2" class="gallery-tab" role="tab" data-gallery="power2" aria-selected="true">2048</button>
          <button id="gallery-tab-fibonacci" class="gallery-tab" role="tab" data-gallery="fibonacci" aria-selected="false">피보나치</button>
        </div>
      </div>
      <div id="tile-gallery" class="tile-gallery"></div>

      <div class="modal-footer">
        <span>모든 기록은 이 브라우저에 안전하게 저장됩니다.</span>
        <button id="btn-stats-reset" class="reset-link">초기화</button>
      </div>
    </div>
  </div>

  <!-- Toast & Screen Reader Live Region -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
